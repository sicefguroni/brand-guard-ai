version: '3.8'

services:
  # 1. The Vector Database
  qdrant_db:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  cache: 
    image: redis:alpine
    container_name: brand_guard_cache
    ports:
      - "6379:6379"

  # 2. BrandGuard AI App
  backend_api:
    build: .
    container_name: brand_guard_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - QDRANT_URL=qdrant_db
      - REDIS_HOST=cache
    depends_on:
      - qdrant_db
      - cache
    dns:
      - 8.8.8.8
      - 8.8.4.4
